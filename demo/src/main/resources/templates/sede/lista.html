<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Sedes</title>
</head>
<body>
<h1>Lista de Sedes</h1>

<a href="/sedes/nuevo">Agregar Elemento</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Distrito</th>
        <th>Dirección</th>
        <th>Editar</th>
        <th>Eliminar</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sede : ${listaSedes}">
        <td th:text="${sede.idsede}"></td>
        <td th:text="${sede.distrito}"></td>
        <td th:text="${sede.direccion}"></td>
        <td><a th:href="@{'/sedes/editar/' + ${sede.idsede}}">Editar</a></td>
        <td><a th:href="@{'/sedes/eliminar/' + ${sede.idsede}}">Eliminar</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
